# ~/.config/hypr/hyprland.conf
# Hyprland-desktopopzet — github.com/simondewaal1980 (Projecten/Hyprland)
#
# De kleuren komen uit de actieve wallpaper. Ze worden door
# ~/.config/hypr/scripts/set-wallpaper.sh in colors.conf geschreven.
# Pas kleuren dus niet hier aan, maar kies een andere wallpaper (Super+W).

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$browser = firefox
$menu = wofi --show drun

source = ~/.config/hypr/colors.conf

################
### MONITORS ###
################

# Alle monitors: voorkeursresolutie, automatisch geplaatst, schaal 1.
monitor = , preferred, auto, 1


###################
### OMGEVING    ###
###################

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# KDE-apps (Dolphin, Kate, Okular, …) zoeken hun menu onder de Plasma-naam.
# Zonder deze variabele kan KService geen standaardapps vinden: Dolphin toont
# dan een leeg "Openen met"-venster in plaats van het juiste programma.
env = XDG_MENU_PREFIX,plasma-

# Qt: Breeze + het pywal-kleurenschema (via apply-kde-theme.sh).
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,Breeze
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# GTK/GNOME-apps en Electron/Firefox.
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = LIBVA_DRIVER_NAME,iHD

# Cursor (Sweet-cursors is al geïnstalleerd).
env = XCURSOR_THEME,Sweet-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#################
### AUTOSTART ###
#################

# Zet de Hyprland-omgeving in de systemd-user-manager, zodat de
# wallpaper-timer en dbus-activatie weten waar ze moeten kijken.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_MENU_PREFIX HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_MENU_PREFIX

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Koptelefoon automatisch verbinden. Het script wacht zelf tot de
# Bluetooth-adapter klaar is en probeert het daarna een aantal keer.
exec-once = ~/.config/hypr/scripts/connect-soundcore.sh

# Vibe Typer (spraak-naar-tekst) in het systeemvak. --autostart is dezelfde
# modus die de app zelf voor "Launch at login" gebruikt; ontbreekt de AppImage,
# dan wordt hij overgeslagen.
exec-once = sh -c '[ -x "$HOME/AppImages/VibeTyper.AppImage" ] && exec "$HOME/AppImages/VibeTyper.AppImage" --autostart'

# Klembordgeschiedenis (tekst en afbeeldingen).
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Eerste keer thema toepassen; hyprpaper heeft even nodig om te starten.
exec-once = sh -c 'sleep 2; ~/.config/hypr/scripts/set-wallpaper.sh'


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 14

    border_size = 2

    col.active_border = $primary $secondary 45deg
    col.inactive_border = $outline

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.97
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = $shadow
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.15
        ignore_opacity = true
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 92%
    animation = windowsOut,    1, 1.49, linear,       popin 92%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
    vfr = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant = alt-intl
    kb_model = pc105
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# Drie vingers horizontaal = workspace wisselen.
gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################

# Apps
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, google-chrome
bind = $mainMod, C, exec, code

# Vensters
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, Space, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Focus en verplaatsen
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40
bind = $mainMod, Tab, cyclenext
bind = $mainMod SHIFT, Tab, cyclenext, prev

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Desktopfuncties
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper-pick.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-rotate.sh
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard.sh
bind = $mainMod, L, exec, ~/.config/hypr/scripts/lock.sh
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/power-menu.sh
bind = $mainMod, N, exec, makoctl dismiss -a
bind = $mainMod SHIFT, C, exec, hyprpicker -a
bind = $mainMod, U, exec, pkill -SIGUSR1 -x waybar
bind = $mainMod, R, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, pkill -SIGUSR2 -x waybar

# Schermafdrukken
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh region

# Volume en helderheid
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Sommige hulpprogramma's horen zwevend, gecentreerd en op een handige maat.
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol)$
    float = yes
    size = 900 620
    center = yes
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = yes
    size = 900 620
    center = yes
}

windowrule {
    name = float-nm-connection-editor
    match:class = ^(nm-connection-editor)$
    float = yes
    size = 900 620
    center = yes
}

windowrule {
    name = float-file-choosers
    match:title = ^(Open File|Save File|Choose File|Bestand openen|Bestand opslaan)$
    float = yes
    size = 1000 700
    center = yes
}

windowrule {
    name = float-hyprland-run
    match:class = ^(hyprland-run)$
    float = yes
    size = 700 400
    center = yes
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = yes
    pin = yes
    size = 480 270
}

# XWayland-sleepfix (uit de standaardconfiguratie van Hyprland).
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Maximaliseren van apps die dat zelf aanvragen negeren.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Laag-effecten: blur en transparantie voor de bar en overlays.
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = on
    ignore_alpha = 0
}

layerrule {
    name = blur-mako
    match:namespace = mako
    blur = on
    ignore_alpha = 0
}

layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = on
    ignore_alpha = 0.2
}

layerrule {
    name = blur-wlogout
    match:namespace = logout_dialog
    blur = on
    ignore_alpha = 0.2
}

xwayland {
    force_zero_scaling = true
}
