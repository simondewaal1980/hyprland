# hypridle — automatisch vergrendelen en het scherm uitschakelen.
# Pas de tijden gerust aan; hypridle herlaadt na opnieuw inloggen.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Na 5 minuten inactiviteit vergrendelen.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Na 10 minuten het scherm uitschakelen (accu sparen).
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
