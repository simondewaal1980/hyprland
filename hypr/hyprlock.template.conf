# hyprlock — vergrendelscherm.
#
# Dit is een TEMPLATE. set-wallpaper.sh vervangt de {{plaatshouders}} en
# schrijft het resultaat naar ~/.config/hypr/hyprlock.conf. Pas het uiterlijk
# dus hier aan en kies daarna opnieuw een wallpaper (of draai
# ~/.config/hypr/scripts/set-wallpaper.sh).

$font = Inter

general {
    hide_cursor = true
}

background {
    monitor =
    path = {{wallpaper}}
    blur_passes = 3
    blur_size = 6
    noise = 0.0
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    rounding = 28
    outer_color = {{primary}}
    inner_color = {{surface_glass}}
    font_color = {{fg}}
    font_family = $font
    placeholder_text = Ontgrendelen…
    fail_text = $PAMFAIL
    check_color = {{success}}
    fail_color = {{error}}
    fade_on_empty = false
    dots_size = 0.32
    dots_spacing = 0.3
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    font_family = $font
    font_size = 96
    color = {{fg}}
    position = 0, 230
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=nl_NL.UTF-8 date +"%A %d %B"
    font_family = $font
    font_size = 18
    color = {{muted}}
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = Welkom terug
    font_family = $font
    font_size = 14
    color = {{muted}}
    position = 0, -140
    halign = center
    valign = center
}
